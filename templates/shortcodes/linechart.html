<div class="line_chart_source"
     data-line_chart_source_path="{{ src }}"
     data-line_chart_download_url="{{ get_url(path=src, trailing_slash=false) }}"
     {% if title is defined %}data-line_chart_title="{{ title }}"{% endif %}
     {% if subtitle is defined %}data-line_chart_subtitle="{{ subtitle }}"{% endif %}
     {% if x_label is defined %}data-line_chart_x_axis_label="{{ x_label }}"{% endif %}
     {% if y_label is defined %}data-line_chart_y_axis_label="{{ y_label }}"{% endif %}
     {% if date_format is defined %}data-line_chart_date_format="{{ date_format }}"{% endif %}
     {% if source is defined %}data-line_chart_source_note="{{ source }}"{% endif %}>
  Chart preview is generated by the production build.
</div>
